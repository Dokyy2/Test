<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عيادة دكتورة دعاء - Premium Hybrid UI</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
/* 1. الإعدادات العامة والخلفية الكريستالية */
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    background-image:
        radial-gradient(at 0% 0%, #ffe4ec 0, transparent 50%),
        radial-gradient(at 100% 100%, #fdf2f8 0, transparent 50%);
    overflow: hidden;
}

/* 2. حاوية التطبيق (App Container) */
.app {
    width: 95%;
    max-width: 360px;
    height: 92vh;
    border-radius: 50px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: white;
    box-shadow: 0 30px 70px rgba(0,0,0,0.08);
    border: 1px solid rgba(252, 231, 243, 0.5);
}

/* 3. الهيدر (Header) */
.header { 
    padding: 18px; 
    text-align: center; 
    font-weight: 700; 
    background: white; 
    border-bottom: 1px solid #fce7f3; 
    color: #be185d; 
    font-size: 1.1rem;
}

/* 4. منطقة المحتوى القابلة للتمرير */
.main-content { 
    flex: 1; 
    overflow-y: auto; 
    padding-bottom: 20px; 
    scrollbar-width: none; /* إخفاء السكرول في فايرفوكس */
}
.main-content::-webkit-scrollbar { display: none; /* إخفاء السكرول في كروم */ }

/* 5. البانر (Banner) */
.banner {
    margin: 15px; 
    padding: 20px; 
    border-radius: 30px; 
    color: #be185d; 
    font-weight: 700; 
    text-align: center;
    border: 1.5px solid transparent;
    background: linear-gradient(white,white) padding-box, linear-gradient(135deg,#fce7f3,#fff,#fce7f3) border-box;
    box-shadow: 0 10px 25px rgba(236,72,153,0.08);
}

/* 6. الكروت (Cards) */
.cards { padding: 0 15px; display: flex; flex-direction: column; gap: 12px; }

.card {
    padding: 18px; 
    border-radius: 28px; 
    border: 1.5px solid transparent;
    background: linear-gradient(white,white) padding-box, linear-gradient(135deg,#fce7f3,#fff,#fce7f3) border-box;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.title { font-weight: 700; margin-bottom: 5px; color: #334155; }

/* 7. الأزرار النيون (Neon Buttons) */
.btn {
    margin-top: 10px; 
    width: 100%; 
    padding: 12px; 
    border-radius: 18px; 
    border: none; 
    font-weight: 700; 
    color: white;
    background: linear-gradient(135deg,#ec4899,#be185d);
    box-shadow: 0 5px 15px rgba(236,72,153,0.3);
    cursor: pointer;
    transition: 0.2s;
}
.btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(236,72,153,0.5); }

/* 8. شريط الأيقونات السفلي (Social Navigation) */
.social-nav {
    display: flex;
    justify-content: space-around; /* توزيع المسافات بالمللي */
    align-items: center;
    padding: 12px 5px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid #fce7f3;
}

.social-item {
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
}

/* تأثير الـ Hover */
.social-item:hover {
    transform: translateY(-5px);
    filter: brightness(1.2);
}

/* الأيقونات العادية 4K */
.social-item img {
    width: 26px;
    height: 26px;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.1)) contrast(1.1) brightness(1.1);
    transition: 0.3s;
}

/* تمييز أيقونة الواتساب (34px) */
.wa-special img {
    width: 34px; 
    height: 34px;
    filter: drop-shadow(0 0 8px rgba(37, 211, 102, 0.35));
    animation: wa-glow 2s infinite ease-in-out;
}

/* أنيميشن نبض الواتساب */
@keyframes wa-glow {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(37, 211, 102, 0.3)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 12px rgba(37, 211, 102, 0.6)); }
}

/* تأثير اللمس (Active) */
.social-item:active { transform: scale(0.8); filter: brightness(1.5); }

</style>
</head>

<body>

<div class="app">

    <div class="header">👶 عيادة دكتورة دعاء</div>

    <div class="main-content">
        
        <div class="banner">
            ✨ أحدث الأجهزة الطبية<br>
            📅 احجزي بسهولة واطمني
        </div>

        <div class="cards">
            <div class="card">
                <div class="title">📅 حجز ميعاد</div>
                <div style="font-size: 0.9rem; color: #64748b;">اختاري نوع الكشف واحنا نحددلك أقرب موعد</div>
                <button class="btn">ابدئي الحجز</button>
            </div>

            <div class="card">
                <div class="title">🤰 احسبي عمر حملك</div>
                <div style="font-size: 0.9rem; color: #64748b;">نتيجة فورية + موعد الولادة المتوقع</div>
                <button class="btn">احسبي الآن</button>
            </div>

            <div class="card">
                <div class="title">🎁 عروض وخدمات</div>
                <div style="font-size: 0.9rem; color: #64748b;">اكتشفي أحدث العروض المتاحة</div>
                <button class="btn">شوفي العروض</button>
            </div>
        </div>
    </div>

    <div class="social-nav">
        <a href="https://instagram.com" class="social-item">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
        </a>
        
        <a href="https://facebook.com" class="social-item">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
        </a>
        
        <a href="https://wa.me/201125337717" class="social-item wa-special" onclick="if(navigator.vibrate) navigator.vibrate(50);">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
        </a>
        
        <a href="#" class="social-item">
            <img src="https://cdn-icons-png.flaticon.com/512/1358/1358023.png" alt="Share">
        </a>
        
        <a href="https://tiktok.com" class="social-item">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
        </a>
    </div>

</div>

</body>
</html>
