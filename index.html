<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>عيادة دكتورة دعاء - Premium Hybrid UI</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
/* 1. الإعدادات العامة والخلفية الكريستالية */
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    /* ضبط الارتفاع ليكون ديناميكي بالمللي */
    height: 100vh;
    height: 100dvh; 
    display: flex;
    flex-direction: column;
    justify-content: center; /* التوسيط الرأسي */
    align-items: center; /* التوسيط الأفقي */
    background: #fff;
    background-image:
        radial-gradient(at 0% 0%, #ffe4ec 0, transparent 50%),
        radial-gradient(at 100% 100%, #fdf2f8 0, transparent 50%);
    overflow: hidden;
}

/* 2. حاوية التطبيق - التعديل الجوهري هنا للتوازن البصري */
.app {
    width: 92%; /* ترك مساحة بسيطة يميناً ويساراً للشياكة */
    max-width: 400px;
    /* الارتفاع هنا يضمن التوازن */
    height: 94%; 
    max-height: 850px; /* أقصى ارتفاع لضمان عدم التمدد المشوه */
    display: flex;
    flex-direction: column;
    background: white;
    border-radius: 50px; 
    box-shadow: 0 30px 70px rgba(0,0,0,0.08);
    border: 1px solid rgba(252, 231, 243, 0.5);
    overflow: hidden;
    position: relative;
}

/* 3. الهيدر */
.header { 
    padding: 18px 15px; 
    text-align: center; 
    font-weight: 700; 
    background: white; 
    border-bottom: 1px solid #f1f5f9; 
    color: #be185d; 
    font-size: 1.1rem;
    flex-shrink: 0;
}

/* 4. منطقة المحتوى */
.main-content { 
    flex: 1; 
    overflow-y: auto; 
    padding: 10px 0;
    scrollbar-width: none; 
}
.main-content::-webkit-scrollbar { display: none; }

/* 5. البانر */
.banner {
    margin: 15px 15px 20px 15px;
    padding: 22px 15px; 
    border-radius: 28px; 
    color: #be185d; 
    font-weight: 700; 
    text-align: center;
    border: 1.5px solid transparent;
    background: linear-gradient(white,white) padding-box, linear-gradient(135deg,#fce7f3,#fff,#fce7f3) border-box;
    box-shadow: 0 10px 25px rgba(236,72,153,0.05);
    line-height: 1.7;
}

/* 6. الكروت */
.cards { 
    padding: 0 15px; 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
}

.card {
    padding: 20px; 
    border-radius: 30px; 
    border: 1.5px solid transparent;
    background: linear-gradient(white,white) padding-box, linear-gradient(135deg,#fce7f3,#fff,#fce7f3) border-box;
    box-shadow: 0 8px 25px rgba(0,0,0,0.03);
}

.title { font-weight: 700; margin-bottom: 5px; color: #334155; font-size: 1rem; }
.desc { font-size: 0.85rem; color: #64748b; margin-bottom: 12px; line-height: 1.4; }

/* 7. الأزرار */
.btn {
    width: 100%; 
    padding: 12px; 
    border-radius: 18px; 
    border: none; 
    font-weight: 700; 
    color: white;
    background: linear-gradient(135deg,#ec4899,#be185d);
    box-shadow: 0 5px 15px rgba(236,72,153,0.2);
    cursor: pointer;
    font-family: 'Cairo';
}

/* 8. شريط الأيقونات السفلي - متوازن تماماً */
.social-nav {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    padding: 12px 10px 15px 10px; 
    background: #ffffff;
    border-top: 1px solid #f1f5f9;
    flex-shrink: 0;
}

.social-item {
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 45px;
    height: 45px;
}

.social-item img {
    width: 24px;
    height: 24px;
    filter: contrast(1.1);
}

.wa-special img {
    width: 32px; 
    height: 32px;
    animation: wa-glow 2s infinite ease-in-out;
}

@keyframes wa-glow {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(37, 211, 102, 0.2)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(37, 211, 102, 0.4)); }
}

</style>
</head>

<body>

<div class="app">

    <div class="header">👶 عيادة دكتورة دعاء</div>

    <div class="main-content">
        
        <div class="banner">
            ✨ أحدث الأجهزة الطبية<br>
            📅 احجزي بسهولة واطمني
        </div>

        <div class="cards">
            <div class="card">
                <div class="title">📅 حجز ميعاد</div>
                <div class="desc">اختاري نوع الكشف واحنا نحددلك أقرب موعد</div>
                <button class="btn">ابدئي الحجز</button>
            </div>

            <div class="card">
                <div class="title">🤰 احسبي عمر حملك</div>
                <div class="desc">نتيجة فورية + موعد الولادة المتوقع</div>
                <button class="btn">احسبي الآن</button>
            </div>

            <div class="card">
                <div class="title">🎁 عروض وخدمات</div>
                <div class="desc">اكتشفي أحدث العروض المتاحة الآن</div>
                <button class="btn">شوفي العروض</button>
            </div>
        </div>
    </div>

    <div class="social-nav">
        <a href="https://instagram.com" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
        <a href="https://facebook.com" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></a>
        <a href="https://wa.me/201125337717" class="social-item wa-special" onclick="if(navigator.vibrate) navigator.vibrate(50);"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp"></a>
        <a href="#" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/1358/1358023.png" alt="Share"></a>
        <a href="https://tiktok.com" class="social-item"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok"></a>
    </div>

</div>

</body>
</html>
